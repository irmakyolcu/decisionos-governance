# =====================================================================
# DecisionOS — fully self-contained on-premise stack (air-gapped)
# Nothing here reaches the public internet. Bring images in with
# ./scripts/offline-bundle.sh on a connected machine, then load them
# on the customer host with `docker load`.
#
#   docker compose --env-file ./.env up -d
# =====================================================================

name: decisionos

services:
  # ------------------------------------------------------------------
  db: # PostgreSQL 15 — all application data lives here
  # ------------------------------------------------------------------
    image: supabase/postgres:15.8.1.020
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  # ------------------------------------------------------------------
  auth: # GoTrue — email/password auth, no external identity providers
  # ------------------------------------------------------------------
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_AUD: ${JWT_AUD}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
    networks: [internal]

  # ------------------------------------------------------------------
  rest: # PostgREST — the data API the frontend calls (RLS enforced)
  # ------------------------------------------------------------------
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    networks: [internal]

  # ------------------------------------------------------------------
  storage: # File storage for company-docs / meeting-recordings / avatars
  # ------------------------------------------------------------------
    image: supabase/storage-api:v1.19.3
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: decisionos
      REGION: onprem
      GLOBAL_S3_BUCKET: decisionos
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./volumes/storage:/var/lib/storage
    networks: [internal]

  # ------------------------------------------------------------------
  meta: # schema introspection used by the migration runner
  # ------------------------------------------------------------------
    image: supabase/postgres-meta:v0.86.1
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [internal]

  # ------------------------------------------------------------------
  functions: # Deno edge runtime — AI, reports, ingestion, licensing
  # ------------------------------------------------------------------
    image: supabase/edge-runtime:v1.67.4
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # ---- local AI, no vendor gateway ----
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL}
      AI_ENABLED: ${AI_ENABLED}
      AI_ALLOW_EXTERNAL: ${AI_ALLOW_EXTERNAL}
      STT_BASE_URL: ${STT_BASE_URL}
      TTS_BASE_URL: ${TTS_BASE_URL}
      ALLOW_OUTBOUND_INTERNET: ${ALLOW_OUTBOUND_INTERNET}
      # ---- offline licensing ----
      DECISIONOS_LICENSE: ${DECISIONOS_LICENSE}
      DECISIONOS_LICENSE_PUBLIC_KEY: ${DECISIONOS_LICENSE_PUBLIC_KEY}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
    volumes:
      - ../supabase/functions:/home/deno/functions:ro
    command: ["start", "--main-service", "/home/deno/functions"]
    networks: [internal]

  # ------------------------------------------------------------------
  ollama: # local LLM runtime — models preloaded from the offline bundle
  # ------------------------------------------------------------------
    image: ollama/ollama:0.5.7
    restart: unless-stopped
    volumes:
      - ./volumes/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "2"
    # Uncomment on GPU hosts (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks: [internal]

  # ------------------------------------------------------------------
  kong: # single API entrypoint: /auth /rest /storage /functions
  # ------------------------------------------------------------------
    image: kong:2.8.1
    restart: unless-stopped
    depends_on: [auth, rest, storage, functions]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./kong.yml:/home/kong/kong.yml:ro
    ports:
      - "${KONG_HTTP_PORT}:8000"
    networks: [internal, edge]

  # ------------------------------------------------------------------
  app: # the DecisionOS web UI (static build served by nginx)
  # ------------------------------------------------------------------
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_SUPABASE_URL: ${API_EXTERNAL_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_SUPABASE_PROJECT_ID: onprem
    image: decisionos/app:${DECISIONOS_VERSION:-latest}
    restart: unless-stopped
    depends_on: [kong]
    ports:
      - "${APP_HTTP_PORT}:80"
    networks: [edge]

networks:
  internal:
    driver: bridge
    internal: false # set true after images are loaded for strict air-gap
  edge:
    driver: bridge
